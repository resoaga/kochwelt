<!DOCTYPE html>
<html lang="de">
  <head>
    <link rel="stylesheet" href="assets/css/header.css" />
    <link rel="stylesheet" href="assets/css/footer.css" />
    <link rel="stylesheet" href="assets/css/contact.css" />
    <link
      rel="icon"
      type="image/x-icon"
      href="assets/Img/logo_small_white.png"
    />
    <script src="assets/JS/script.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontakt</title>
  </head>
  <body>
    <header>
      <div class="headerdisplay">
        <div>
          <a href="index.html"
            ><img class="Kochweltlogo" src="assets/Img/logo.png" alt="Kochwelt"
          /></a>
        </div>
        <button class="burger-menu" aria-label="Menu" onclick="myFunction()">
          <span class="burger-line"></span>
          <span class="burger-line"></span>
          <span class="burger-line"></span>
        </button>
        <nav id="myLinks">
          <h2 class="start">
            <a href="index.html" class="navlink navihide">Start</a>
          </h2>
          <h2 class="dayrecipe">
            <a href="dayreciept.html" class="navlink navhide"
              >Rezept des Tages</a
            >
          </h2>
          <h2 class="contact">
            <a href="kontakt.html" class="navlink navihide">Kontakt</a>
          </h2>
          <h2 class="imprint">
            <a href="impressum.html" class="navlink navihide">Impressum</a>
          </h2>
        </nav>
      </div>
    </header>
    <main>
      <div class="contact-box">
        <h1>Kontaktiere uns</h1>
        <form onsubmit="sendMail(event)" class="contact-form">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required />

          <label for="email">E-Mail:</label>
          <input type="text" id="email" name="email" required />

          <label for="message">Nachricht:</label>
          <textarea id="message" name="message" rows="5" required></textarea>

          <button type="submit" class="button">Absenden</button>
        </form>
      </div>
    </main>
    <footer>
      <div class="footer-wrapper">
        <div>
          <img class="footer-logo" src="assets/Img/logo_white.png" alt="logo" />
          <img
            class="footer-logo-mobile hide"
            src="assets/Img/logo_small_white.png"
            alt="logo"
          />
        </div>
        <div>
          <div class="link-text">
            <a class="footer-link" href="impressum.html">Impressum</a> |
            <a class="footer-link" href="datenschutz.html">Datenschutz</a>
          </div>
          <p>&copy; 2025 Kochwelt. Alle Rechte vorbehalten.</p>
        </div>
        <div class="social-media">
          <a
            target="_blank"
            rel="noopener noreferrer"
            href="https://www.facebook.com/"
            ><img class="icons" src="assets/Img/facebook.png" alt="facebook"
          /></a>
          <a
            target="_blank"
            rel="noopener noreferrer"
            href="https://www.instagram.com/"
            ><img class="icons" src="assets/Img/instagram.png" alt="instagram"
          /></a>
          <a
            target="_blank"
            rel="noopener noreferrer"
            href="https://www.youtube.com/"
            ><img class="icons" src="assets/Img/youtube.png" alt="youtube"
          /></a>
        </div>
      </div>
    </footer>
    <script src="assets/JS/burgermenu.js"></script>
  </body>
</html>
